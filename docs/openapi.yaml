openapi: 3.0.3
info:
  title: 'Vending Machine API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Authentication
    description: "\nGet a JWT access token and inspect the current user."
  -
    name: Products
    description: ''
  -
    name: Purchases
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Get a JWT token by calling `POST /api/v1/auth/login` with email and password. Use the `access_token` as Bearer token.'
security:
  -
    default: []
paths:
  /api/v1/auth/login:
    post:
      summary: 'Log in'
      operationId: logIn
      description: "Exchange email and password for a JWT (HS256, 60 minutes). Send it as\n`Authorization: Bearer <token>` on protected endpoints. Rate-limited to 5 attempts per minute."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                  token_type: Bearer
                  expires_in: 3600
                properties:
                  access_token:
                    type: string
                    example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    example: 3600
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Invalid credentials.'
                  errors:
                    email:
                      - 'Invalid credentials.'
                properties:
                  message:
                    type: string
                    example: 'Invalid credentials.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'Invalid credentials.'
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Account email.'
                  example: user@vending.test
                password:
                  type: string
                  description: 'Account password.'
                  example: password
              required:
                - email
                - password
      security: []
  /api/v1/auth/me:
    get:
      summary: 'Current user'
      operationId: currentUser
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 2
                  name: 'Demo User'
                  email: user@vending.test
                  permissions:
                    - products.purchase
                properties:
                  id:
                    type: integer
                    example: 2
                  name:
                    type: string
                    example: 'Demo User'
                  email:
                    type: string
                    example: user@vending.test
                  permissions:
                    type: array
                    example:
                      - products.purchase
                    items:
                      type: string
      tags:
        - Authentication
  /api/v1/products:
    get:
      summary: 'List products'
      operationId: listProducts
      description: 'Paginated, sortable and searchable. Prices are decimal strings ("6.885").'
      parameters:
        -
          in: query
          name: sort
          description: 'Column: name, price, quantity_available or created_at.'
          example: price
          required: false
          schema:
            type: string
            description: 'Column: name, price, quantity_available or created_at.'
            example: price
        -
          in: query
          name: direction
          description: 'asc or desc.'
          example: desc
          required: false
          schema:
            type: string
            description: 'asc or desc.'
            example: desc
        -
          in: query
          name: per_page
          description: '5, 10 or 25.'
          example: 10
          required: false
          schema:
            type: integer
            description: '5, 10 or 25.'
            example: 10
        -
          in: query
          name: q
          description: 'Search by name.'
          example: pep
          required: false
          schema:
            type: string
            description: 'Search by name.'
            example: pep
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 2
                      name: Pepsi
                      slug: pepsi
                      price: '6.885'
                      quantity_available: 7
                      created_at: '2026-11-17T16:28:47+00:00'
                      updated_at: '2026-11-17T20:17:21+00:00'
                  links:
                    first: 'http://localhost:8000/api/v1/products?sort=price&direction=desc&per_page=10&q=pep&page=1'
                    last: 'http://localhost:8000/api/v1/products?sort=price&direction=desc&per_page=10&q=pep&page=1'
                    prev: null
                    next: null
                  meta:
                    current_page: 1
                    from: 1
                    last_page: 1
                    links:
                      -
                        url: null
                        label: '&laquo; Previous'
                        page: null
                        active: false
                      -
                        url: 'http://localhost:8000/api/v1/products?sort=price&direction=desc&per_page=10&q=pep&page=1'
                        label: '1'
                        page: 1
                        active: true
                      -
                        url: null
                        label: 'Next &raquo;'
                        page: null
                        active: false
                    path: 'http://localhost:8000/api/v1/products'
                    per_page: 10
                    to: 1
                    total: 1
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 2
                        name: Pepsi
                        slug: pepsi
                        price: '6.885'
                        quantity_available: 7
                        created_at: '2026-11-17T16:28:47+00:00'
                        updated_at: '2026-11-17T20:17:21+00:00'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 2
                        name:
                          type: string
                          example: Pepsi
                        slug:
                          type: string
                          example: pepsi
                        price:
                          type: string
                          example: '6.885'
                        quantity_available:
                          type: integer
                          example: 7
                        created_at:
                          type: string
                          example: '2026-11-17T16:28:47+00:00'
                        updated_at:
                          type: string
                          example: '2026-11-17T20:17:21+00:00'
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: 'http://localhost:8000/api/v1/products?sort=price&direction=desc&per_page=10&q=pep&page=1'
                      last:
                        type: string
                        example: 'http://localhost:8000/api/v1/products?sort=price&direction=desc&per_page=10&q=pep&page=1'
                      prev:
                        type: string
                        example: null
                        nullable: true
                      next:
                        type: string
                        example: null
                        nullable: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      from:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 1
                      links:
                        type: array
                        example:
                          -
                            url: null
                            label: '&laquo; Previous'
                            page: null
                            active: false
                          -
                            url: 'http://localhost:8000/api/v1/products?sort=price&direction=desc&per_page=10&q=pep&page=1'
                            label: '1'
                            page: 1
                            active: true
                          -
                            url: null
                            label: 'Next &raquo;'
                            page: null
                            active: false
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              example: null
                              nullable: true
                            label:
                              type: string
                              example: '&laquo; Previous'
                            page:
                              type: string
                              example: null
                              nullable: true
                            active:
                              type: boolean
                              example: false
                      path:
                        type: string
                        example: 'http://localhost:8000/api/v1/products'
                      per_page:
                        type: integer
                        example: 10
                      to:
                        type: integer
                        example: 1
                      total:
                        type: integer
                        example: 1
      tags:
        - Products
      security: []
    post:
      summary: 'Create a product'
      operationId: createAProduct
      description: 'Requires the `products.manage` permission (admin).'
      parameters: []
      responses: {}
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Unique product name. Must not be greater than 100 characters.'
                  example: 'Iced Coffee'
                price:
                  type: number
                  description: 'Price in USD, up to 3 decimals. Must not be greater than 99999.999.'
                  example: 2.875
                quantity_available:
                  type: integer
                  description: 'Units in the machine. Must be at least 0. Must not be greater than 100000.'
                  example: 12
              required:
                - name
                - price
                - quantity_available
  '/api/v1/products/{product_id}':
    get:
      summary: 'Show a product'
      operationId: showAProduct
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    name: Coke
                    slug: coke
                    price: '3.990'
                    quantity_available: 10
                    created_at: '2026-11-17T16:28:46+00:00'
                    updated_at: '2026-11-17T16:28:46+00:00'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: Coke
                      slug:
                        type: string
                        example: coke
                      price:
                        type: string
                        example: '3.990'
                      quantity_available:
                        type: integer
                        example: 10
                      created_at:
                        type: string
                        example: '2026-11-17T16:28:46+00:00'
                      updated_at:
                        type: string
                        example: '2026-11-17T16:28:46+00:00'
      tags:
        - Products
      security: []
    put:
      summary: 'Update a product'
      operationId: updateAProduct
      description: 'Requires the `products.manage` permission (admin).'
      parameters: []
      responses: {}
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Unique product name. Must not be greater than 100 characters.'
                  example: 'Iced Coffee'
                price:
                  type: number
                  description: 'Price in USD, up to 3 decimals. Must not be greater than 99999.999.'
                  example: 2.875
                quantity_available:
                  type: integer
                  description: 'Units in the machine. Must be at least 0. Must not be greater than 100000.'
                  example: 12
              required:
                - name
                - price
                - quantity_available
    delete:
      summary: 'Delete a product'
      operationId: deleteAProduct
      description: 'Soft delete — purchase history keeps pointing at it. Requires `products.manage`.'
      parameters: []
      responses:
        204:
          description: Deleted
          content:
            text/plain:
              schema:
                type: string
                example: ''
      tags:
        - Products
    parameters:
      -
        in: path
        name: product_id
        description: 'The ID of the product.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: product
        description: 'The product ID.'
        example: 2
        required: true
        schema:
          type: integer
  /api/v1/transactions:
    get:
      summary: 'List transactions'
      operationId: listTransactions
      description: "Users see their own purchases; holders of `transactions.view-all` see everyone's."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      product_name: Pepsi
                      quantity: 3
                      unit_price: '6.885'
                      total_price: '20.655'
                      amount_paid: '25.000'
                      change_given: '4.345'
                      created_at: '2026-11-18T03:46:09+00:00'
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        product_name: Pepsi
                        quantity: 3
                        unit_price: '6.885'
                        total_price: '20.655'
                        amount_paid: '25.000'
                        change_given: '4.345'
                        created_at: '2026-11-18T03:46:09+00:00'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        product_name:
                          type: string
                          example: Pepsi
                        quantity:
                          type: integer
                          example: 3
                        unit_price:
                          type: string
                          example: '6.885'
                        total_price:
                          type: string
                          example: '20.655'
                        amount_paid:
                          type: string
                          example: '25.000'
                        change_given:
                          type: string
                          example: '4.345'
                        created_at:
                          type: string
                          example: '2026-11-18T03:46:09+00:00'
      tags:
        - Purchases
  '/api/v1/products/{product_id}/purchase':
    post:
      summary: 'Purchase a product'
      operationId: purchaseAProduct
      description: "The server reads the price from the database (locked row) — clients only send\nthe quantity and the money inserted. Domain errors: 409 not enough stock /\nproduct unavailable, 422 not enough money."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  transaction_id: 1
                  product_name: Pepsi
                  quantity: 3
                  unit_price: '6.885'
                  total_price: '20.655'
                  amount_paid: '25.000'
                  change_given: '4.345'
                properties:
                  transaction_id:
                    type: integer
                    example: 1
                  product_name:
                    type: string
                    example: Pepsi
                  quantity:
                    type: integer
                    example: 3
                  unit_price:
                    type: string
                    example: '6.885'
                  total_price:
                    type: string
                    example: '20.655'
                  amount_paid:
                    type: string
                    example: '25.000'
                  change_given:
                    type: string
                    example: '4.345'
        409:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Only 7 left in stock.'
                  errors:
                    quantity:
                      - 'Only 7 left in stock.'
                properties:
                  message:
                    type: string
                    example: 'Only 7 left in stock.'
                  errors:
                    type: object
                    properties:
                      quantity:
                        type: array
                        example:
                          - 'Only 7 left in stock.'
                        items:
                          type: string
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'You need to insert at least 20.655 USD.'
                  errors:
                    amount_paid:
                      - 'You need to insert at least 20.655 USD.'
                properties:
                  message:
                    type: string
                    example: 'You need to insert at least 20.655 USD.'
                  errors:
                    type: object
                    properties:
                      amount_paid:
                        type: array
                        example:
                          - 'You need to insert at least 20.655 USD.'
                        items:
                          type: string
      tags:
        - Purchases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
                  description: 'How many to buy (1–1000, at most the stock). Must be at least 1. Must not be greater than 1000.'
                  example: 3
                amount_paid:
                  type: number
                  description: 'Money inserted in USD, up to 3 decimals (max 10000). Must not be greater than 10000.'
                  example: 25.0
              required:
                - quantity
                - amount_paid
    parameters:
      -
        in: path
        name: product_id
        description: 'The ID of the product.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: product
        description: 'The product ID.'
        example: 2
        required: true
        schema:
          type: integer
