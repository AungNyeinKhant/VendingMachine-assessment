name: Authentication
description: |-

  Get a JWT access token and inspect the current user.
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/auth/login
    metadata:
      custom: []
      groupName: Authentication
      groupDescription: |-

        Get a JWT access token and inspect the current user.
      subgroup: ''
      subgroupDescription: ''
      title: 'Log in'
      description: |-
        Exchange email and password for a JWT (HS256, 60 minutes). Send it as
        `Authorization: Bearer <token>` on protected endpoints. Rate-limited to 5 attempts per minute.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      email:
        custom: []
        name: email
        description: 'Account email.'
        required: true
        example: user@vending.test
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      password:
        custom: []
        name: password
        description: 'Account password.'
        required: true
        example: password
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      email: user@vending.test
      password: password
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"access_token": "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...", "token_type": "Bearer", "expires_in": 3600}'
        headers: []
        description: ''
      -
        custom: []
        status: 401
        content: '{"message": "Invalid credentials.", "errors": {"email": ["Invalid credentials."]}}'
        headers: []
        description: ''
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - GET
    uri: api/v1/auth/me
    metadata:
      custom: []
      groupName: Authentication
      groupDescription: |-

        Get a JWT access token and inspect the current user.
      subgroup: ''
      subgroupDescription: ''
      title: 'Current user'
      description: ''
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_JWT_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"id": 2, "name": "Demo User", "email": "user@vending.test", "permissions": ["products.purchase"]}'
        headers: []
        description: ''
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 6g43cv8PD1aE5beadkZfhV6'
    controller: null
    method: null
    route: null
